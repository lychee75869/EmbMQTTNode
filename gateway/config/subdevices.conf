# EmbMQTTNode 子设备注册表（华为云 IoTDA 接入）
# 格式: key = value，# 或 ; 开头为注释，[段] 跳过（与 node.conf 一致）
#
# 格式:
#   subdevice_N = <data_source>,<source_key>,<device_id>,<name>[,<service_id>]
#
# 参数说明:
#   data_source - 数据源种类: modbus（预留: ble，蓝牙近场子设备演进）
#   source_key  - modbus: 从站地址 slave_id (1-247)
#   device_id   - 平台注册后分配的子设备设备ID（≤256 字符，
#                 不含空格与 MQTT 通配符 $ # +）
#   name        - 展示名（仅日志用）
#   service_id  - 可选，缺省 SensorData（须与云侧产品模型 C-1 对齐）
#
# 说明:
#   - 本表数据源无关：未来新增数据源（如 STM32 BLE）仅需新增 data_source 取值，
#     网关核心代码零改动。
#   - 网关纯化：板载采集层移除，sensor 数据源通道不再受支持；
#     sensor 条目按 unknown data_source 整条丢弃并打印 WARN。
#   - device_id 须与 IoTDA 控制台注册结果一致；子设备增删后
#     执行 `systemctl restart embmqttnode` 生效（无热加载）。
#   - 校验为 fail-closed：非法条目整条丢弃并打印 [WARN]，不影响其它条目。
#
# 示例（请替换为控制台分配的真实 device_id）:
#subdevice_1 = modbus,1,e5f6a7b8-zzzz,PLC-Line1
#subdevice_2 = modbus,2,e5f6a7b9-yyyy,PLC-Line2,CustomSvc
