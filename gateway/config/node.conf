# EmbMQTTNode 节点配置文件
# 格式: key = value，# 开头为注释

# ─── MQTT 连接 ───────────────────────────────
# MQTT 服务器地址
broker_host = 127.0.0.1

# MQTT 服务器端口
# 不加密: 1883
# TLS 加密: 8883
broker_port = 1883

# 数据上报主题
topic = embmqttnode/data

# 本节点客户端 ID（留空则自动基于 MAC 地址生成）
# 注释掉或设为 "emb-node-01" 将自动使用 emb-node-<MAC后6位>
client_id = emb-node-01

#调试级别：0/1/2/3
debug_level = 3

# ─── TLS 安全配置 ────────────────────────────
# 0 = 不启用（默认）
# 1 = 单向认证（验证 Broker CA 证书）
# 2 = 双向认证（客户端也提供证书）
tls_enabled = 0

# CA 证书路径（PEM 格式，验证 MQTT Broker 身份）
# 示例: /etc/embmqttnode/tls/ca.crt
tls_ca_file = /etc/embmqttnode/tls/ca.crt

# 客户端证书路径（仅双向认证时需要）
tls_cert_file = /etc/embmqttnode/tls/client.crt

# 客户端私钥路径（仅双向认证时需要）
tls_key_file = /etc/embmqttnode/tls/client.key

# MQTT 用户名（可选）
#broker_username = embmqttnode

# MQTT 密码（可选）
#broker_password = mypassword

# ─── Modbus 工业协议 ──────────────────────────
# 是否启用 Modbus 模块：0 = 关闭 1 = 启用
modbus_enabled = 1

# 连接模式：rtu = 串口 RS-485   tcp = 以太网
modbus_mode = tcp

# --- RTU 参数（modbus_mode=rtu 时生效）---
modbus_serial_port = /dev/ttyUSB0
modbus_baudrate = 9600
modbus_parity = N
modbus_data_bits = 8
modbus_stop_bits = 1

# --- TCP 参数（modbus_mode=tcp 时生效）---
modbus_tcp_host = 127.0.0.1
# 502 为特权端口，普通用户无法绑定；模拟器（tools/modbus_slave_sim.py）默认 1502
modbus_tcp_port = 1502

# Modbus 轮询间隔（毫秒）
modbus_poll_interval_ms = 2000

# ─── Modbus 寄存器映射 ───────────────────────
# 每行一个映射，格式:
# modbus_reg_N = slave_id,reg_addr,reg_count,func_code,data_type,field_name,scale,offset
#
# 参数说明:
#   slave_id   - 从站地址 (1-247)
#   reg_addr   - 寄存器起始地址 (30001 输入 / 40001 保持)
#   reg_count  - 连续寄存器数量
#   func_code  - 功能码: 3=读保持寄存器 4=读输入寄存器
#   data_type  - 数据类型: int16 / uint16 / float32 / int32
#   field_name - 映射字段: temperature / humidity / pressure /
#                soil_moisture / water_level / battery_voltage
#   scale      - 比例因子 (物理值 = 原始值 × scale + offset)
#   offset     - 偏移量
#
# 契约（docs/项目文档.md 模块一，8 寄存器子设备）:
#   40001 土壤湿度 ÷10 %      40002 空气温度 ÷10 ℃(int16)
#   40003 空气湿度 ÷10 %RH    40004 水槽水位 ÷10 %
#   40005 电池电压 ÷100 V     40006 浇水秒数(读写,s)
#   40007 泵速(读写,%)        40008 状态字(bit0泵/bit1缺水/bit2湿度故障/bit3低电/bit4自动)
modbus_reg_1 = 1,40001,1,3,int16,soil_moisture,0.1,0
modbus_reg_2 = 1,40002,1,3,int16,temperature,0.1,0
modbus_reg_3 = 1,40003,1,3,int16,humidity,0.1,0
modbus_reg_4 = 1,40004,1,3,int16,water_level,0.1,0
modbus_reg_5 = 1,40005,1,3,int16,battery_voltage,0.01,0
# 40006（浇水秒数）/ 40007（泵速）/ 40008（状态字）待写路径实现后再映射：
# 当前仅只读采集，读回设定值 / 状态字需先具备写寄存器通道。

# ─── OTA 远程升级 ───────────────────
# 是否启用 OTA 远程升级: 0=关闭 1=启用
ota_enabled = 0

# A/B 槽位根目录（必须持久化目录——/tmp 因 systemd PrivateTmp=tmpfs，重启即清空，
# 固件活不过服务重启，会导致冷启动 slot 文件丢失，无法选槽）
ota_slot_dir = /var/lib/embmqttnode

# 新版本启动失败最大重试次数（超过则自动回滚）
ota_boot_attempt_max = 3

# 新固件稳定运行该秒数后确认健康：清零 boot_count，宣告本次启动成功。
# 由主循环每 5s 调一次 ota_confirm_boot；超时即清零。
ota_boot_confirm_sec = 300

# 固件签名公钥路径（PEM "PUBLIC KEY"，强制验签，fail-closed）
# 未配置（留空/注释本行）时 OTA 升级指令将被直接拒绝——固件必须签名：
#   私钥签名:  tools/sign_firmware.sh <私钥> <固件.bin>   → 产出 <固件>.sig
#   公钥生成:  openssl rsa -in ota_root_key.pem -pubout -out ota_pub.pem
# .sig 与固件放在同一 HTTP(S) 目录，设备自动拉取 <固件URL>.sig
#ota_public_key = /etc/embmqttnode/ota_pub.pem

# 固件源为 https:// 时的证书校验锚点（CA 证书 bundle / c_rehash 目录）
# 两者均留空则尝试系统 CA 常见位置；找不到有效 CA 时拒绝 https 下载
#ota_ca_file = /etc/embmqttnode/ota_ca.pem
#ota_ca_path = /etc/ssl/certs

# ─── HTTP Dashboard ─────────────────
# 是否启用 Web Dashboard: 0=关闭 1=启用（端口固定 8080）
http_enabled = 1

# POST /api/reboot 的认证 token（fail-closed）：
#   - 留空/注释本行 = 未配置，重启接口一律返回 403（拒绝）
#   - 配置后请求体需携带 {"token":"<本值>"}，比较为常量时间（防时序侧信道）
#   - 请用足够长的随机串（建议 ≥32 字符），勿再使用 reboot123 之类弱值
#     生成示例: openssl rand -hex 32
#http_reboot_token = change-me-to-a-long-random-secret

# ─── 华为云 IoTDA 平台接入──────────────
# 上报后端切换: local = 现有 mosquitto 本地路径（缺省，行为完全一致）
#               huawei = 华为云 IoTDA（8883 强制 TLS，不注册遗嘱）
# 注意: 修改本段任一配置后需 `systemctl restart embmqttnode` 生效（无热加载）。
platform = local

# 网关设备 device_id（IoTDA 控制台注册网关后获得，≤256 字符）
#huawei_device_id = 0000000000000000000000000000000_my-gateway

# 设备密钥（secret）：仅当 platform = huawei 时使用。
# 安全: 该值永不打日志（config_dump 仅显示 "(configured)"）；请设置文件权限 600
#huawei_secret = your-device-secret

# 签名类型: 0 = 不校验时间戳（推荐默认，规避设备时钟漂移）
#           1 = 校验时间戳（平台有 ±30 分钟时间窗容差）
#huawei_auth_type = 0

# MQTT keepalive（秒），合法范围 30~1200，越界自动钳制并告警（缺省 120）
#huawei_keepalive = 120

# 网关属性周期上报间隔（秒，缺省 60）
#huawei_props_interval = 60

# 子设备无数据判定离线的秒数（缺省 30）
#subdev_offline_sec = 30

# 子设备注册表路径（缺省 /etc/embmqttnode/subdevices.conf，绝对路径；格式见该文件头注释）
#subdevices_conf = /etc/embmqttnode/subdevices.conf

# 华为预置 CA 证书路径（PEM）。platform = huawei 时用于 8883 TLS 校验锚点
#huawei_ca_file = /etc/embmqttnode/huawei_ca.pem
