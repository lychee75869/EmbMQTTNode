# EmbMQTTNode 节点配置文件
# 格式: key = value，# 开头为注释

# ─── MQTT 连接 ───────────────────────────────
# MQTT 服务器地址
broker_host = 127.0.0.1

# MQTT 服务器端口
# 不加密: 1883
# TLS 加密: 8883
broker_port = 1883

# 数据上报主题
topic = embmqttnode/data

# 本节点客户端 ID（留空则自动基于 MAC 地址生成）
# 注释掉或设为 "emb-node-01" 将自动使用 emb-node-<MAC后6位>
client_id = emb-node-01

# 采样间隔，单位毫秒
sample_interval_ms = 5000

# 传感器类型：mock / extreme / ads1115 / sht30
#   mock     - 模拟数据（每 4 次注入一次异常，用于测试规则引擎/异常检测）
#   extreme  - 模拟极端环境数据
#   ads1115  - 扩展板板载 ADC（I2C 地址 0x48），AIN0/1/2 → temperature/
#              humidity/pressure 三个字段，数值为通道电压（V），±4.096V 量程
#   sht30    - 温湿度传感器（地址 0x44）
sensor_type = extreme

# I2C 适配器设备路径（真实硬件传感器使用）
# 用 `ls /dev/i2c-*` 查看；用 `sudo i2cdetect -y N` 扫描确认器件地址：
#   ADS1115 固定 0x48，SHT30 固定 0x44
# 扩展板的 I2C 接口和板载 ADS1115 挂在同一条 TWI1 总线上
sensor_i2c_dev = /dev/i2c-1

#调试级别：0/1/2/3
debug_level = 3

# ─── TLS 安全配置 ────────────────────────────
# 0 = 不启用（默认）
# 1 = 单向认证（验证 Broker CA 证书）
# 2 = 双向认证（客户端也提供证书）
tls_enabled = 0

# CA 证书路径（PEM 格式，验证 MQTT Broker 身份）
# 示例: /etc/embmqttnode/tls/ca.crt
tls_ca_file = /etc/embmqttnode/tls/ca.crt

# 客户端证书路径（仅双向认证时需要）
tls_cert_file = /etc/embmqttnode/tls/client.crt

# 客户端私钥路径（仅双向认证时需要）
tls_key_file = /etc/embmqttnode/tls/client.key

# MQTT 用户名（可选）
#broker_username = embmqttnode

# MQTT 密码（可选）
#broker_password = mypassword

# ─── Modbus 工业协议 ──────────────────────────
# 是否启用 Modbus 模块：0 = 关闭 1 = 启用
modbus_enabled = 0

# 连接模式：rtu = 串口 RS-485   tcp = 以太网
modbus_mode = tcp

# --- RTU 参数（modbus_mode=rtu 时生效）---
modbus_serial_port = /dev/ttyUSB0
modbus_baudrate = 9600
modbus_parity = N
modbus_data_bits = 8
modbus_stop_bits = 1

# --- TCP 参数（modbus_mode=tcp 时生效）---
modbus_tcp_host = 127.0.0.1
modbus_tcp_port = 502

# Modbus 轮询间隔（毫秒）
modbus_poll_interval_ms = 2000

# ─── Modbus 寄存器映射 ───────────────────────
# 每行一个映射，格式:
# modbus_reg_N = slave_id,reg_addr,reg_count,func_code,data_type,field_name,scale,offset
#
# 参数说明:
#   slave_id   - 从站地址 (1-247)
#   reg_addr   - 寄存器起始地址 (30001 输入 / 40001 保持)
#   reg_count  - 连续寄存器数量
#   func_code  - 功能码: 3=读保持寄存器 4=读输入寄存器
#   data_type  - 数据类型: int16 / uint16 / float32 / int32
#   field_name - 映射字段: temperature / humidity / pressure
#   scale      - 比例因子 (物理值 = 原始值 × scale + offset)
#   offset     - 偏移量
#
# 示例: PLC 从站 #1，保持寄存器 40001=温度(℃)×10
#modbus_reg_1 = 1,40001,1,3,int16,temperature,0.1,0
#modbus_reg_2 = 1,40002,1,3,int16,humidity,0.1,0
#modbus_reg_3 = 1,40003,2,3,float32,pressure,1.0,0

# ─── 规则引擎（阶段三）────────────────────────
# 格式: rule_N = field,operator,threshold,action
#
# field:     temperature / humidity / pressure
# operator:  gt (>), lt (<), eq (==), ne (!=), between (区间外), rate (变化率)
# threshold: 单值数字 (gt/lt/eq/ne)
#            lo_hi 格式 (between, 例 950.0_1050.0)
#            rate_window 格式 (rate, 例 5.0_60s 表示60秒内变化超5.0)
# action:    log_only, alert_mqtt, gpio_1, gpio_2, all
#            多个动作用 + 号连接，如 alert_mqtt+gpio_1
#
# 示例（默认全部注释，按需打开）:
#rule_1 = temperature,gt,85.0,alert_mqtt+gpio_1
#rule_2 = humidity,lt,10.0,alert_mqtt
#rule_3 = pressure,between,950.0_1050.0,log_only
#rule_4 = temperature,rate,5.0_60s,alert_mqtt

# ─── OTA 远程升级（阶段四）───────────────────
# 是否启用 OTA 远程升级: 0=关闭 1=启用
ota_enabled = 0

# A/B 槽位根目录（开发阶段用目录模拟）
# 生产环境通常为独立分区如 /mnt/ota
ota_slot_dir = /tmp/embmqttnode

# 新版本启动失败最大重试次数（超过则自动回滚）
ota_boot_attempt_max = 3

# ─── 异常检测引擎（方向 B）─────────────────────
# 是否启用异常检测引擎: 0=关闭 1=启用
anomaly_enabled = 1

# 格式: anomaly_N = field,algo,threshold,action
# field:     temperature / humidity / pressure
# algo:      zscore (统计方法) / iforest (机器学习)
# threshold: Z-score倍数 (如 3.0 表示 3σ) 或 iForest分数 (如 0.65)
# action:    log_only, alert_mqtt, gpio_1, gpio_2, all
#            多个动作用 + 号连接
#
# 示例（默认全部注释，按需打开）:
#anomaly_1 = temperature,zscore,2.5,alert_mqtt
#anomaly_2 = humidity,zscore,2.5,alert_mqtt
#anomaly_3 = pressure,iforest,0.65,alert_mqtt

